[project]
name = "slatehire"
version = "1.0.1"
description = "Slatehire: hiring and onboarding pipeline where a person decides every outcome"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "sendora-core",
  "alembic>=1.14",
  "cryptography>=43",
  "uvicorn>=0.30",
  "pypdf>=7",
  "reportlab>=5.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "pyyaml>=6", "hypothesis>=6"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slatehire"]

[tool.coverage.run]
source = ["src/slatehire"]
