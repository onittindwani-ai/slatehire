[project]
name = "sendora-core"
version = "1.2.3"
description = "Shared API foundation for the Sendora AI systems"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sendora_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/sendora_core"]
