# Generated by tools/make_ci.py in the hub repository (sendora-ai-systems). Edit the template there, not this file.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            packages/core-py/pyproject.toml
            apps/api/pyproject.toml
      - run: pip install -c constraints.txt -e packages/core-py -e "apps/api[dev]"
      - run: python -m pytest -q
      - run: python tools/score_tools.py --check
      - run: python tools/check_docs.py
      - run: python tools/scan_secrets.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            packages/core-py/pyproject.toml
            apps/api/pyproject.toml
      # the browser tests start the API from .venv, the same place `make install` puts it
      - run: python -m venv .venv && .venv/bin/pip install -c constraints.txt -e packages/core-py -e "apps/api[dev]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ui
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: apps/web
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_SHARED_SECRET=$(openssl rand -hex 16)"
            echo "ALLOW_DEMO_SERVER=true"  # a throw away demo on Postgres, which the app refuses otherwise
          } >> .env
      - run: docker compose build
      - run: docker compose up -d
      - name: The API and the web app answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then echo "up after ${i} tries"; exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail 80
          exit 1
      - if: always()
        run: docker compose down -v
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -c constraints.txt -e packages/core-py -e apps/api && pip-audit --skip-editable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm audit --prod --audit-level=high
